name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the runs before it, on main as on a pull request: the
# newest commit's run covers theirs. A release commit runs on its own, so
# that it is neither queued behind nor canceled by others, as its tag waits
# for its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'Release ') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # -race: Linux took 24 minutes, macOS 18
    env:
      MYGO_E2E_CALLBACKS_FILE: ${{ github.workspace }}/callbacks.txt # what the GUI tests print, which go test hides
      LINUX_PACKAGES: libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      # Ubuntu's mirrors are slow now and then (9 minutes for these packages
      # once), so the packages are kept in the Actions cache, under a key of
      # the files apt would download for them.
      - name: List the packages for WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        id: apt
        run: |
          sudo apt-get update
          debs=$(apt-get install --print-uris -qq -y --no-install-recommends $LINUX_PACKAGES | awk '{print $2}' | sort | sha256sum | cut -c1-16)
          echo "prefix=apt-$ImageOS-${{ runner.arch }}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$ImageOS-${{ runner.arch }}-$debs" >> "$GITHUB_OUTPUT"
      - name: Restore the packages
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          apt="-o Dir::Cache::Archives=$HOME/.cache/apt-archives -o APT::Sandbox::User=root"
          sudo apt-get install -y --no-install-recommends $apt $LINUX_PACKAGES
          # Drops what a restored older cache has that the mirror no longer does.
          sudo apt-get autoclean $apt
          sudo chown -R "$USER" ~/.cache/apt-archives
      - name: Save the packages
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt.outputs.key }}
      # The Direct3D debug layer (MYGO_D3D_DEBUG=1) is the "Graphics Tools"
      # feature of Windows; the runner lacks it.
      - name: Install the Direct3D debug layer
        if: runner.os == 'Windows'
        run: Add-WindowsCapability -Online -Name Tools.Graphics.DirectX~~~~0.0.1.0
      - name: Test the Direct3D debug layer
        if: runner.os == 'Windows'
        env:
          MYGO_D3D_DEBUG_REQUIRED: 1
        run: go test -count=1 -v -run TestNewWithDebug ./internal/gpu/d3d11/device
      - run: bun install --frozen-lockfile
      - name: Build the JavaScript packages
        run: bun run build
      - name: Build and vet every platform
        if: runner.os == 'Linux'
        run: |
          for os in darwin linux windows; do
            GOOS=$os go build ./...
            GOOS=$os go vet ./...
            # Production builds leave the inspector of native UI out.
            GOOS=$os go vet -tags mygo_noinspector ./...
          done
          GOOS=freebsd go build ./...
          # 32-bit Windows and Linux have no backend, but compile.
          GOOS=windows GOARCH=386 go build ./...
          GOOS=linux GOARCH=386 go build ./...
          # Browsers run native UI; the CLI is for desktops.
          export GOOS=js GOARCH=wasm
          go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v /cmd/mygo)
          go vet $(go list ./... | grep -v /cmd/mygo)
          go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/web ./internal/gpu/gl
      # The plugins' tests load the native libraries their mygo-plugin.json
      # pins, and on Windows the installer tests run the NSIS that
      # internal/nsis pins, all of which they download into the user's cache
      # when it lacks them. Downloading them here, before the tests, and
      # keeping them in the Actions cache under a key of what pins them,
      # keeps the tests off the network and its hosts' passing failures.
      - name: Restore the downloads of the tests
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/*/mygo-plugin.json', 'internal/nsis/nsis.go') }}
      - name: Download what the tests need
        run: go run ./internal/prefetch
      - name: Save the downloads of the tests
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # The race detector and a shuffled order of the tests and benchmarks'
      # run on the unit tests; the GUI tests below are not run with them.
      # cmd/mygo takes 9 to 10 minutes on macOS under -race, the default limit.
      - run: go test -race -shuffle=on -timeout 25m ./...
      # Without cgo the apps run on purego's fakecgo, which links against the
      # runtime's internals: start every test binary that way, and the
      # packages of the native calls (the tests above use the real cgo where
      # a C compiler is, so none of them meets fakecgo).
      - name: Start every test binary through fakecgo
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 -run '^$' ./...
          go test -count=1 ${{ runner.os == 'macOS' && './internal/darwin' || './internal/linux' }}
      - name: Test without the inspector, as production builds
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on -timeout 25m -tags mygo_noinspector ./ui .
      - run: bun run test
      - run: bun run typecheck
      - name: GUI tests
        if: runner.os != 'Linux'
        env:
          MYGO_E2E: 1
        run: go test ./internal/e2e
      - name: GUI tests
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: xvfb-run -a dbus-run-session -- go test ./internal/e2e
      # Runners have no GPU, so native UI draws on the CPU above; MYGO_GPU=1
      # draws it with OpenGL all the same, on Mesa's llvmpipe.
      - name: GUI tests of native UI drawn with OpenGL
        if: runner.os == 'Linux'
        env:
          MYGO_E2E: 1
          MYGO_GPU: 1
        run: xvfb-run -a dbus-run-session -- go test -run 'TestContentWindow' ./internal/e2e
      - name: Callbacks the GUI tests made
        if: always()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/callbacks.txt" || true

  # Linux on ARM64, which no machine of the maintainers runs: purego's calls
  # into WebKitGTK, GTK and Mesa pass floats and structs in registers of the
  # arm64 calling convention, which the amd64 runners never exercise.
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      MYGO_E2E_CALLBACKS_FILE: ${{ github.workspace }}/callbacks.txt # what the GUI tests print, which go test hides
    # The build and vet of every platform, the no-inspector tests and the
    # JavaScript packages are the same on every architecture, so they are
    # left to the amd64 job, and Bun with them.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      # As in the job above.
      - name: Restore the downloads of the tests
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/mygo/natives
            ~/.cache/mygo/nsis-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/*/mygo-plugin.json', 'internal/nsis/nsis.go') }}
      - name: Download what the tests need
        run: go run ./internal/prefetch
      - name: Save the downloads of the tests
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/mygo/natives
            ~/.cache/mygo/nsis-*
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - run: go test -race -shuffle=on -timeout 25m ./...
      - name: Start every test binary through fakecgo
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 -run '^$' ./...
          go test -count=1 ./internal/linux
      - name: GUI tests
        env:
          MYGO_E2E: 1
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: xvfb-run -a dbus-run-session -- go test ./internal/e2e
      # As in the job above: OpenGL on Mesa's llvmpipe.
      - name: GUI tests of native UI drawn with OpenGL
        env:
          MYGO_E2E: 1
          MYGO_GPU: 1
        run: xvfb-run -a dbus-run-session -- go test -run 'TestContentWindow' ./internal/e2e
      - name: Callbacks the GUI tests made
        if: always()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/callbacks.txt" || true

  # Windows on ARM64, which no machine of the maintainers runs: DirectWrite's
  # methods taking floats go through purego, which sets the floating point
  # registers syscall leaves alone there, and Direct3D 11 draws native UI.
  # The JavaScript packages are the same everywhere, so Bun is left out.
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      MYGO_E2E_CALLBACKS_FILE: ${{ github.workspace }}/callbacks.txt # what the GUI tests print, which go test hides
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # As in the job above.
      - name: Restore the downloads of the tests
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/*/mygo-plugin.json', 'internal/nsis/nsis.go') }}
      - name: Download what the tests need
        run: go run ./internal/prefetch
      - name: Save the downloads of the tests
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/natives
            ${{ runner.os == 'Windows' && '~/AppData/Local' || runner.os == 'macOS' && '~/Library/Caches' || '~/.cache' }}/mygo/nsis-*
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # The race detector does not run on Windows ARM64.
      - run: go test -shuffle=on ./...
      # The runner's provisioning daemon (provjobd, under hosted-compute-agent)
      # runs wsl.exe every 30 seconds. This image has no WSL, and some of those
      # runs start `wsl.exe --update --confirm --prompt-before-exit`, whose new
      # Windows Terminal window takes the front from a test's window and stays
      # open. With WSL installed they start none. The ones already open go.
      - name: Install WSL, so the runner's wsl.exe opens no window
        run: |
          $msi = "$env:RUNNER_TEMP\wsl.msi"
          Invoke-WebRequest https://github.com/microsoft/WSL/releases/download/3.0.3/wsl.3.0.3.0.arm64.msi -OutFile $msi
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "wsl.msi is not signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $p = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode)" }
          wsl.exe --version
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'wsl\.exe --update' } | ForEach-Object {
            "stopping $($_.Name) $($_.ProcessId): $($_.CommandLine)"
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
      # The runner's image leaves the "Microsoft account" screen of Windows'
      # first run in front, a full-screen window of WwaHost (a CoreWindow of
      # the shell), and the Start and Search flyouts of the shell come up
      # when it goes. Windows gives the front to no other app while a window
      # like these is in it, so every GUI test that needs its window in front
      # waited for it in vain. Closing the screen, and the flyouts as Escape
      # does, leaves the desktop in front, as it is on the Windows runner.
      # What else is in front, or none of this, is left as it is.
      - name: Clear the first run screen from the front
        run: |
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Front {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr e);
            static string Of(IntPtr h) {
              var c = new StringBuilder(256); var t = new StringBuilder(256);
              GetClassName(h, c, 256); GetWindowText(h, t, 256);
              return c + " '" + t + "'";
            }
            public static string Now() { return Of(GetForegroundWindow()); }
            public static string All() {
              var sb = new StringBuilder();
              EnumWindows((h, l) => { if (IsWindowVisible(h)) sb.AppendLine("  " + Of(h)); return true; }, IntPtr.Zero);
              return sb.ToString();
            }
            public static bool CloseFirstRun() {
              if (Now() != "Windows.UI.Core.CoreWindow 'Microsoft account'") return false;
              return PostMessage(GetForegroundWindow(), 0x10, IntPtr.Zero, IntPtr.Zero);
            }
            public static bool Flyout() {
              var w = Now();
              return w == "Windows.UI.Core.CoreWindow 'Start'" || w == "Windows.UI.Core.CoreWindow 'Search'";
            }
            public static void Escape() { keybd_event(0x1B, 0, 0, UIntPtr.Zero); keybd_event(0x1B, 0, 2, UIntPtr.Zero); }
          }
          "@
          "in front: " + [Front]::Now()
          "windows:"
          [Front]::All()
          if ([Front]::CloseFirstRun()) {
            Start-Sleep -Seconds 2
            "closed the first run screen; in front: " + [Front]::Now()
          }
          for ($i = 0; $i -lt 3 -and [Front]::Flyout(); $i++) {
            [Front]::Escape()
            Start-Sleep -Seconds 2
            "Escape; in front: " + [Front]::Now()
          }
      - name: GUI tests of native UI
        env:
          MYGO_E2E: 1
        run: go test ./internal/e2e
      - name: Callbacks the GUI tests made
        if: always()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/callbacks.txt" || true
